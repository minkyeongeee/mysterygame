/* Layout: 책상 위에 놓인 사건 파일 폴더. 폴더 색인 탭 = 진행 단계, 폴더 안 = 클립으로 묶은 증거 서류 + 클립보드에 끼운 수사 보고서.
   한 가지 세계(어두운 책상 + 종이)로 고정한 단일 테마. */
:root{
  --desk:#252A28; --desk-2:#1C201F; --desk-ink:#E8E5DA; --desk-muted:#A5A99F;
  --paper:#F7F5EE; --paper-2:#ECE8DC; --ink:#1E2225; --muted:#5C6266; --rule:#D2CCBC;
  --stamp:#B3322A; --ok:#2B6E43; --ok-soft:#DCEADF; --bad:#A8322A; --bad-soft:#F5DDD8; --warn-soft:#F7EBC8;
  --note:#FBF0B4; --note-line:#E6D58C; --tape:rgba(232,222,186,.82); --clip:#8C9398;
  --radio-bg:#1E2620; --radio-fg:#BDE3A4; --board:#7B5D3E; --board-2:#5F462D; --greenbar:#E4EFE3;
  --sea:#C9DAE4; --land:#F0EEE6; --north:#DCD9CE; --border-line:#B8B3A6;
  --folder:#5F6B3C; --folder-2:#4A5430; --folder-ink:#EEF0E2; --accent:#4D5A2C; --accent-soft:#E2E7D1;
  --display:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --type:"Nanum Gothic Coding","Noto Sans KR",ui-monospace,monospace;
  --hand:"Kyobo Hand","Nanum Pen Script","나눔손글씨 펜",cursive;
  color-scheme:light;
}
.case-dmz{--folder:#5F6B3C;--folder-2:#4A5430;--folder-ink:#EEF0E2;--accent:#4D5A2C;--accent-soft:#E2E7D1}
.case-map{--folder:#D3B57A;--folder-2:#B99A5E;--folder-ink:#3A2D12;--accent:#27407A;--accent-soft:#DFE5F3}
*{box-sizing:border-box}
body{background:radial-gradient(120% 70% at 50% 0%,#2F3532,var(--desk) 55%,var(--desk-2));background-color:var(--desk);color:var(--desk-ink);
  font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;text-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;min-height:100%}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0;letter-spacing:0}
b,strong{font-family:var(--display);font-weight:700}
p{margin:0}
.ln{display:block}
.keep{display:inline-block;max-width:100%}
/* 짧은 글(제목·질문·보기·기록·메모·캡션)은 줄 길이를 고르게 맞춰, 마지막 줄에 한두 단어만 남지 않게 한다 */
.label h2,.fhead h1{text-wrap:balance}
/* 용어 설명은 내어쓰기: 둘째 줄부터 들여 쓴다 */
.def{padding-left:1em;text-indent:-1em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #E0A82E;outline-offset:2px}
.typed{font-family:var(--type)}

/* ---------- top line ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-bottom:22px;font-size:14px;color:var(--desk-muted)}
.topbar b{color:var(--desk-ink)}
.deskbtn{background:transparent;border:1px solid #4A514D;color:var(--desk-ink);border-radius:6px;padding:6px 14px;font-size:14px}
.deskbtn:hover{border-color:var(--desk-ink)}
.meters{display:flex;gap:8px;flex-wrap:wrap}
.meter{background:var(--desk-2);border:1px solid #3B423F;border-radius:4px;padding:3px 10px;display:grid;line-height:1.25;min-width:84px}
.meter small{font-family:var(--type);font-size:11px;color:var(--desk-muted)}
.meter b{font-family:var(--type);font-size:19px;font-variant-numeric:tabular-nums;color:var(--desk-ink)}

/* ---------- home ---------- */
.hero{padding-block:6px 26px;display:grid;gap:12px}
.hero .kicker{font-family:var(--type);font-size:13px;color:var(--desk-muted)}
.hero h1{font-size:clamp(30px,5.6vw,50px);color:#F4F1E6}
.hero .lede{max-width:38em;color:#CFCBBE;font-size:17px}
.team{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.team label{font-family:var(--display);font-weight:700}
.team input{font:inherit;padding:8px 12px;border:1px solid #4A514D;border-radius:6px;background:var(--desk-2);color:var(--desk-ink);width:min(260px,100%)}
.covers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:34px 28px;margin-top:30px}
.coverbtn{all:unset;box-sizing:border-box;display:block;cursor:pointer;position:relative;padding-top:30px}
.coverbtn:focus-visible{outline:3px solid #E0A82E;outline-offset:6px;border-radius:8px}
.cover-tab{position:absolute;top:0;left:0;height:34px;width:46%;background:var(--folder);border-radius:10px 10px 0 0;color:var(--folder-ink);font-family:var(--type);font-size:13px;padding:7px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover{position:relative;background:var(--folder);color:var(--folder-ink);border-radius:0 12px 12px 12px;padding:26px 24px 22px;min-height:290px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 2px 0 rgba(255,255,255,.12) inset,0 22px 40px rgba(0,0,0,.45);transition:transform .2s}
.cover::before{content:"";position:absolute;inset:-8px 14px auto auto;width:62%;height:14px;background:var(--paper);border-radius:2px;z-index:-1;transform:rotate(1.2deg);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.coverbtn:hover .cover{transform:translateY(-3px) rotate(-.3deg)}
.label{background:var(--paper);color:var(--ink);padding:14px 16px;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.25);display:grid;gap:6px;transform:rotate(-.6deg)}
.label .no{font-family:var(--type);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.label h2{font-size:clamp(22px,3.4vw,27px)}
.cover .sum{font-size:15px;line-height:1.6}
.cover .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;font-family:var(--type);font-size:12px}
.cover .meta span{border:1px solid currentColor;border-radius:3px;padding:1px 8px;opacity:.85}
.stamp{font-family:var(--display);font-weight:700;color:var(--stamp);border:3px double var(--stamp);padding:2px 12px;letter-spacing:.2em;display:inline-block;transform:rotate(7deg);background:rgba(255,255,255,.04)}
.cover .stamp{position:absolute;right:18px;bottom:52px;font-size:18px;opacity:.9}
.case-dmz .cover .stamp{color:#F2B8AE;border-color:#F2B8AE}
.howto{margin-top:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:16px}
.howto div{border-left:3px solid #4A514D;padding-left:12px;color:#C9C5B8;font-size:15px}
.howto b{color:var(--desk-ink);display:block;font-size:16px}

/* ---------- open folder ---------- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding-left:10px;position:relative;z-index:1}
.tab{background:var(--folder-2);color:var(--folder-ink);border:0;border-radius:9px 9px 0 0;padding:7px 14px 9px;font-family:var(--type);font-size:13px;opacity:.9}
.tab[aria-current="step"]{background:var(--folder);opacity:1;font-weight:700}
.tab:disabled{opacity:.4;cursor:not-allowed}
.tab .ck{color:inherit;margin-right:3px}
.folder{background:var(--folder);color:var(--folder-ink);border-radius:0 12px 12px 12px;padding:clamp(12px,2.6vw,26px);box-shadow:0 2px 0 rgba(255,255,255,.1) inset,0 24px 50px rgba(0,0,0,.5);display:grid;gap:20px}
.fhead{display:flex;justify-content:space-between;gap:12px 20px;align-items:flex-start;flex-wrap:wrap}
.fhead .label{max-width:100%;min-width:0}
.fhead h1{font-size:clamp(22px,3.6vw,32px)}
.fhead .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbtn{background:rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.2);color:var(--folder-ink);border-radius:6px;padding:6px 12px;font-size:14px}
.case-dmz .fbtn{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.25)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;background:var(--paper);color:var(--ink);padding:6px 10px;border-radius:4px}

/* ---------- papers ---------- */
.sheet{background:var(--paper);color:var(--ink);position:relative;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 18px rgba(0,0,0,.22);min-width:0}
.sheet.clip::before{content:"";position:absolute;top:-14px;left:22px;width:13px;height:38px;border:3px solid var(--clip);border-radius:8px;border-bottom-color:transparent;z-index:2}
.sheet.clip::after{content:"";position:absolute;top:-6px;left:26px;width:5px;height:26px;border:3px solid var(--clip);border-top:0;border-radius:0 0 6px 6px;z-index:2}
.brief{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.brief{grid-template-columns:minmax(0,1fr)}}
.memo{padding:30px clamp(16px,3vw,28px) 24px;display:grid;gap:12px}
.memo .hd{font-family:var(--type);font-size:12px;color:var(--muted);border-bottom:2px solid var(--ink);padding-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.memo h3{font-size:19px;margin-top:6px}
.memo p{max-width:40em}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:10px;margin-top:4px}
.person{text-align:left;background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;display:grid;gap:1px}
.person:hover{border-color:var(--accent)}
.person .nm{font-family:var(--display);font-weight:700;font-size:18px}
.person .rl{font-size:13px;color:var(--accent);font-family:var(--display);font-weight:700}
.person .more{font-family:var(--type);font-size:11px;color:var(--muted);margin-top:4px}
.cta{justify-self:start;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:12px 22px;font-family:var(--display);font-weight:700;font-size:16px;margin-top:6px}
.cta:hover{background:#000}
.stack{display:grid;gap:22px;min-width:0}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:24px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}}
.stagehead{display:grid;gap:6px}
.stagehead .kick{font-family:var(--type);font-size:13px;opacity:.85}
.stagehead h2{font-size:clamp(22px,3.2vw,28px)}
.stagehead .goal{font-size:16px;opacity:.92}
.caststrip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.caststrip span{font-family:var(--type);font-size:12px;opacity:.8;margin-right:2px}
.namechip{background:var(--paper);color:var(--ink);border:0;border-radius:3px;padding:3px 11px;font-size:13px;font-family:var(--display);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.namechip:hover{background:#fff}
.evidence{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:28px 20px;margin-top:18px;align-items:start}
.ev.wide{grid-column:1/-1}
.evidence > .sheet:nth-child(3n+1){transform:rotate(-.45deg)}
.evidence > .sheet:nth-child(3n+2){transform:rotate(.4deg)}
.evidence > .sheet.wide{transform:none}
.sheet.clip .evh{padding-top:28px}
.evh{display:flex;justify-content:space-between;gap:4px 10px;align-items:baseline;padding:14px 16px 8px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.evh .t{font-family:var(--display);font-weight:700;font-size:16px}
.evh .who{font-family:var(--type);font-size:12px;color:var(--muted)}
.evb{padding:12px 16px 16px;display:grid;gap:8px;min-width:0;font-size:15px}
.loglist{display:grid;gap:7px;margin:0;padding:0;list-style:none;font-family:var(--type);font-size:14px}
.loglist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline}
.loglist .tm{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev.radio .evb{font-family:var(--type);font-size:14px;background:var(--radio-bg);color:var(--radio-fg);gap:12px}
.ev.radio .ts{color:var(--radio-fg);opacity:.7;font-size:12px}
.ev.note{background:var(--note)}
.ev.note .evh{border-color:var(--note-line)}
.ev.note .evb,.ev.note .evb *{font-family:var(--hand)}
.ev.note .evb{font-size:21px;line-height:1.45;color:#3A3220}
.ev.note .evb .small{font-family:var(--hand);font-size:18px;color:#6B5E3A}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(120px,100%),1fr));gap:16px 12px}
.photo{background:#fff;padding:7px 7px 10px;margin:0;box-shadow:0 3px 8px rgba(0,0,0,.2);position:relative;display:grid;gap:6px}
.photo:nth-child(odd){transform:rotate(-1.2deg)}
.photo:nth-child(even){transform:rotate(1deg)}
.photo::before{content:"";position:absolute;top:-8px;left:50%;width:46px;height:16px;margin-left:-23px;background:var(--tape);transform:rotate(-3deg)}
.photo .pic{aspect-ratio:4/3;max-width:100%;background:repeating-linear-gradient(135deg,#E9E7E0 0 7px,#DEDBD2 7px 14px);display:grid;place-items:center;text-align:center;padding:8px;font-size:13px;font-weight:500;color:#3B3F42}
.photo .art{aspect-ratio:4/3;max-width:100%;overflow:hidden;background:#ddd}
.photo .art svg{display:block;width:100%;height:100%}
.photo figcaption{display:grid;gap:1px}
.photo .cap{font-size:12px;line-height:1.4;color:var(--ink)}
.photo .tm{font-family:var(--type);font-size:11px;color:var(--muted)}
.diagram{overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:320px;height:auto}
.small{font-size:13px;color:var(--muted)}
.redline{background:var(--bad-soft);padding:0 3px}
.smudge{filter:blur(1.4px);opacity:.75;letter-spacing:1px}
.quote{border-left:3px solid var(--ink);padding-left:10px;font-family:var(--type)}

/* ---------- clipboard report ---------- */
.board{background:linear-gradient(160deg,var(--board),var(--board-2));border-radius:10px;padding:26px 10px 10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);box-shadow:0 16px 30px rgba(0,0,0,.4)}
@media (max-width:980px){.board{position:static}}
.board::before{content:"";position:absolute;top:-10px;left:50%;width:110px;margin-left:-55px;height:30px;border-radius:6px 6px 10px 10px;background:linear-gradient(#C9CED2,#8F979C);box-shadow:0 3px 6px rgba(0,0,0,.35)}
.report{background:var(--paper);color:var(--ink);border-radius:2px;padding:16px;display:grid;gap:16px}
.report .rh{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px}
.report .rh h3{font-size:19px}
.report .rh span{font-family:var(--type);font-size:12px;color:var(--muted)}
.gate{font-family:var(--type);font-size:13px;background:var(--warn-soft);border:1px dashed #C9A24A;border-radius:3px;padding:6px 10px}
.q{display:grid;gap:9px;padding-top:14px;border-top:1px dashed var(--rule)}
.q:first-of-type{border-top:0;padding-top:0}
.qt{font-family:var(--display);font-weight:700;font-size:16px}
.qt .qn{display:block;font-family:var(--type);font-size:13px;color:var(--accent)}
.qt .small{font-family:var(--body);font-weight:400}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--rule);background:#fff;border-radius:4px;padding:9px 12px;font-size:15px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.opt .bx{width:18px;height:18px;margin-top:3px;border:2px solid #7C8287;border-radius:50%}
.opt.multi .bx{border-radius:3px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .bx{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bx{border-color:var(--ok);background:var(--ok)}
.opt:disabled{cursor:default}
/* 휴대폰에서는 안쪽 여백을 줄여 보기가 한 줄에 들어가게 한다 */
@media (max-width:480px){
  .folder{padding:10px}
  .board{padding:22px 5px 5px;border-radius:8px}
  .report{padding:12px 10px}
  .opt{padding:8px 8px;gap:7px;font-size:14px;letter-spacing:-.01em}
  .opt .bx{width:16px;height:16px}
}
.match{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-items:center;border:1px solid var(--rule);background:#fff;border-radius:4px;padding:8px 10px}
.mrow .ml{font-size:15px}
.mrow.right{border-color:var(--ok);background:var(--ok-soft)}
select{font:inherit;font-size:15px;padding:7px 8px;border-radius:4px;border:1px solid #9AA0A4;background:#fff;color:var(--ink);width:100%;min-width:0}
/* 고른 답이 길어도 잘리지 않도록: 글자는 보이는 칸에 줄바꿈해 보여 주고, 실제 선택 상자는 그 위에 투명하게 덮는다 */
.pick{position:relative;display:block;border:1px solid #9AA0A4;border-radius:4px;background:#fff;padding:7px 32px 7px 10px;min-height:38px;font-size:15px;line-height:1.45;cursor:pointer}
.pick::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pick.empty .pv{color:var(--muted)}
.pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.pick:focus-within{outline:3px solid #E0A82E;outline-offset:2px}
.mrow.right .pick{border-color:var(--ok);background:transparent;cursor:default}
.mrow.right .pick::after{display:none}
.pick select:disabled{cursor:default}
.qbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:5px;padding:8px 16px;font-family:var(--display);font-weight:700;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #9AA0A4;font-family:var(--body);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fb{font-size:14px;border-radius:4px;padding:9px 12px}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.yes{background:var(--ok-soft);color:#1F3D2A}
.fb .tag{display:block;font-family:var(--type);font-size:12px;font-weight:700;letter-spacing:.06em}
.fb.yes .tag{color:var(--ok)}
.hintline{font-size:14px;background:var(--warn-soft);border-radius:4px;padding:8px 12px}
.hintline b{font-family:var(--type)}
.next{background:var(--stamp);color:#fff;border:0;border-radius:5px;padding:11px 16px;font-family:var(--display);font-weight:700}

/* ---------- ending ---------- */
.ending{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:980px){.ending{grid-template-columns:minmax(0,1fr)}}
.ending .memo .stamp{justify-self:start;font-size:22px;margin:4px 0 6px}
.result{display:grid;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--paper-2);border-radius:3px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:var(--type);font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}

/* ---------- teacher key ---------- */
.key{margin-top:46px;border-top:1px solid #3B423F;padding-top:16px;display:grid;gap:12px}
.keyform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.keyform input{font:inherit;padding:6px 10px;border:1px solid #4A514D;border-radius:6px;background:var(--desk-2);color:var(--desk-ink);width:120px;letter-spacing:.2em}
.keyform .btn{background:var(--desk-ink);color:var(--desk)}
.keyform .btn.ghost{background:transparent;color:var(--desk-ink);border-color:#4A514D}
.keyerr{color:#F2B8AE;font-size:14px}
.keygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px}
.keygrid .sheet{padding:16px}
.keygrid ol{margin:8px 0 0;padding-left:20px;font-size:14px;display:grid;gap:4px}
.keynote{font-size:13px;color:var(--desk-muted)}

/* ---------- person card ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,11,.66);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.idcard{background:var(--paper);color:var(--ink);border-radius:6px;max-width:440px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(-.8deg)}
.idcard .bar{background:var(--folder);color:var(--folder-ink);font-family:var(--type);font-size:12px;padding:8px 16px;display:flex;justify-content:space-between;gap:8px}
.idcard .in{padding:18px 20px 8px;display:grid;gap:16px}
.idcard .face{width:86px;aspect-ratio:3/4;background:var(--paper-2);border:1px solid var(--rule);display:grid;place-items:end center;overflow:hidden}
.idcard .face i{display:block;width:44px;height:44px;border-radius:50%;background:#C9C4B6;margin-bottom:-6px;box-shadow:0 -46px 0 -10px #C9C4B6}
.idcard h3{font-size:26px}
.idcard .rl{color:var(--accent);font-family:var(--display);font-weight:700}
.idcard .bio{margin-top:8px;font-size:15px}
.idcard .x{margin:0 18px 18px;justify-self:end}
@media (max-width:380px){.idcard .in{grid-template-columns:minmax(0,1fr)}}

/* ---------- svg ---------- */
.sv-paper{fill:var(--paper)} .sv-ink{fill:var(--ink)} .sv-muted{fill:var(--muted)} .sv-accent{fill:var(--accent)} .sv-stamp{fill:var(--stamp)}
.sv-zone{fill:var(--accent-soft)} .sv-zone2{fill:var(--paper-2)}
.sv-line{stroke:var(--ink);stroke-width:2;fill:none} .sv-dash{stroke:var(--muted);stroke-width:2;stroke-dasharray:6 5;fill:none}
.sv-red{stroke:var(--stamp);stroke-width:3;fill:none}
svg text{font-family:var(--body)}
svg .big{font-family:var(--display);font-weight:700;font-size:22px}
.km .sea{fill:var(--sea)} .km .nk{fill:var(--north)} .km .pv{fill:var(--land);stroke:var(--border-line);stroke-width:.5;stroke-linejoin:round}
.km .mdl{fill:none;stroke:var(--stamp);stroke-width:1.4;stroke-linejoin:round}
.km .sll{fill:none;stroke:var(--ink);stroke-width:.6;stroke-dasharray:2 1.5}
.km .route{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.km .lab{font-size:5.6px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:1.6px;stroke-linejoin:round}
.km .rg{font-size:7px;font-family:var(--display);font-weight:700;fill:#7D8287;letter-spacing:.6px}
.km .sea-t{font-size:7px;font-family:var(--display);font-weight:700;fill:#6E8A9C;letter-spacing:.6px}
.km .tgt{fill:none;stroke:var(--accent);stroke-width:1.2}
.km .tl{font-size:6px;font-weight:700;fill:var(--accent);paint-order:stroke;stroke:var(--land);stroke-width:1.8px;stroke-linejoin:round}
.km .lg{font-size:5.2px;fill:var(--ink)}
.km .cap{font-size:4.6px;fill:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

function unlockKey(code){
  try{
    const bin=atob(KEYBLOB), bytes=new Uint8Array(bin.length), kb=new TextEncoder().encode(code);
    if(!kb.length) return null;
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i)^kb[i%kb.length];
    const data=JSON.parse(new TextDecoder().decode(bytes));
    return Array.isArray(data)?data:null;
  }catch(e){return null}
}

/* 문장마다 한 줄씩, 긴 문장은 쉼표에서 한 번 더 나눈다 (방탈출 게임과 같은 방식) */
const plain = h => h.replace(/<[^>]*>/g,"");
function splitLong(h){
  const L=plain(h).length; if(L<=40) return [h];
  const cands=[]; const re=/,\s/g; let m;
  while((m=re.exec(h))){ const before=h.slice(0,m.index+1);
    if((before.match(/<b>/g)||[]).length!==(before.match(/<\/b>/g)||[]).length) continue;
    if((before.match(/<span/g)||[]).length!==(before.match(/<\/span>/g)||[]).length) continue;
    if((before.match(/[(（]/g)||[]).length!==(before.match(/[)）]/g)||[]).length) continue;
    if((before.match(/[“]/g)||[]).length!==(before.match(/[”]/g)||[]).length) continue;
    const p=plain(before).length/L; if(p>.3&&p<.75) cands.push([Math.abs(p-.5),m.index+1]); }
  if(!cands.length) return [h];
  cands.sort((a,b)=>a[0]-b[0]); const k=cands[0][1];
  return [h.slice(0,k), h.slice(k).trim()];
}
function sentences(h){
  return h.split(/(?<=[^\s(\d][.!?])\s+(?=[^\s<)”])/).map(x=>x.trim()).filter(Boolean).flatMap(splitLong).map(x=>`<span class="ln">${x}</span>`).join("");
}
/* 문장은 화면 너비에 맞춰 자연스럽게 이어지고, 이름·용어·숫자는 중간에서 끊기지 않게 붙여 둔다 */
const GLUE = ["한누리 단장","나경계 장교","조새롬 대원","조새롬 선배","남방 한계선","북방 한계선","군사 분계선","민간인 통제선","민간인 통제 구역","비무장 지대","통일 전망대","을지 전망대","칠성 전망대","평화 전망대","국가 지질 공원","강원 평화 지역","DMZ 평화의 길","예비 배터리","젖은 낙엽","인근 초소","수색 매뉴얼","선 산양","하는 선","자문위원용 카드","자문위원용 열쇠","2층 자료실","2층 복원실","1층 로비","1층 회의실","1층 휴게실","3층 수장고","학예팀 직원","4B 연필","박물관 로고"];
const T = h => {
  if(h==null) return "";
  let out = String(h);
  GLUE.forEach(g=>{ out = out.split(g).join(g.replace(/ /g," ")); });
  return out.replace(/(\d+일) (차)/g,"$1 $2").replace(/(\d+시) (\d+분)/g,"$1 $2").replace(/(\d+초) (뒤)/g,"$1 $2").replace(/(\d+번) (문제|째)/g,"$1 $2").replace(/([’”〉》])(?=[^\s<.,!?])/g,"$1\u2060").replace(/([^\s>])([‘“〈《])/g,"$1\u2060$2");
};
/* 해설은 문장마다 한 줄씩 */
function bySentence(h){
  const parts=[]; let buf="";
  String(h).split(/(?<=[.!?])\s+/).forEach(x=>{ buf = buf ? buf+" "+x : x;
    const open=(buf.match(/<b>/g)||[]).length, close=(buf.match(/<\/b>/g)||[]).length;
    if(open===close){ parts.push(buf); buf=""; } });
  if(buf) parts.push(buf);
  return parts.map(x=>`<span class="ln">${T(x)}</span>`).join("");
}

  <div class="topbar"><span><b>한국지리 탐구</b> · 한반도의 경계와 접경지역</span></div>
  <section class="hero">
    <h1>접경지역 사건 파일</h1>
    <p class="lede">${T("증거를 찾아낸 후, 단계마다 질문에 답해 사건을 해결하세요.")}</p>
    <div class="team"><label for="team">이름 또는 모둠명</label><input id="team" maxlength="20" placeholder="예: 3모둠" value="${esc(S.team)}"></div>
  </section>
  <div class="covers">${covers}</div>
  <div class="howto">
    <div><b>단서를 찾는다</b>${T("여러 단서를 꼼꼼히 비교하세요. 틀린 정보가 섞여 있을 수 있어요.")}</div>
    <div><b>질문에 답한다</b>${T(`단계마다 자료를 분석할 시간이 주어지고, 그 시간이 지나야 답을 제출할 수 있어요. 틀리면 ${LOCK}초 동안 다시 조사해야 해요.`)}</div>
    <div><b>힌트</b>${T(`문제마다 힌트를 2번까지 볼 수 있어요.<br>힌트를 볼 때마다 기록 시간에 ${PEN}초가 더해져요.`)}</div>
  </div>
  ${teacherKey()}`;
}

function teacherKey(){
  if(!keyState.open) return `<div class="key"><div><button class="deskbtn" data-key-open>교사용 정답</button></div></div>`;
  if(!keyState.data) return `<div class="key">
    <form class="keyform" id="keyform"><label for="keycode">교사용 코드</label><input id="keycode" inputmode="numeric" autocomplete="off" maxlength="8"><button class="btn" type="submit">확인</button><button class="btn ghost" type="button" data-key-close>닫기</button></form>
    ${keyState.err?`<p class="keyerr">코드가 맞지 않아요. 다시 입력해 주세요.</p>`:""}</div>`;
  return `<div class="key">
    <div><button class="deskbtn" data-key-close>교사용 정답 닫기</button></div>
    <div class="keygrid">${keyState.data.map(c=>`<section class="sheet"><b>${c.t}</b><ol>${c.k.map(k=>`<li>${k}</li>`).join("")}</ol></section>`).join("")}</div>
    <p class="keynote">${T("진행 기록은 학생이 쓰는 기기의 브라우저에만 저장됩니다. 기기를 바꾸거나 기록을 지우면 처음부터 시작합니다.")}</p></div>`;
}

function caseView(id){
  const c=CASES[id], cs=S.cases[id], steps=stepsOf(c);
  const tabs = steps.map((s,i)=>{
    const done = i<cs.reached || (i===steps.length-1 && cs.end);
    return `<button class="tab" data-step="${i}" ${i>cs.reached?"disabled":""} ${i===cs.view?'aria-current="step"':""}>${done&&i>0?'<span class="ck">✓</span>':""}${s}</button>`;
  }).join("");
  let body;
  if(cs.view===0) body=briefView(id);
  else if(cs.view<=c.stages.length) body=stageView(id,cs.view-1);
  else body=endView(id);
  const meters = cs.start ? `<div class="meters"><div class="meter"><small>수사 기록 시간</small><b id="clock">${fmt(elapsed(cs))}</b></div><div class="meter"><small>오답</small><b>${cs.wrong}</b></div><div class="meter"><small>힌트</small><b>${cs.hints}</b></div></div>` : "";
  return `
  <div class="topbar"><button class="deskbtn" data-home>← 사건 파일 목록</button>${meters}</div>
  <nav class="tabs" aria-label="사건 파일 색인">${tabs}</nav>
  <div class="folder">
    <div class="fhead">
      <div class="label"><span class="no"><span>사건 번호 ${c.no}</span><span>담당: ${c.role}${S.team?" · "+esc(S.team):""}</span></span><h1>${c.title}</h1></div>
      <div class="tools">${resetCtl(id)}</div>
    </div>
    ${body}
  </div>`;
}

function resetCtl(id){
  if(confirmReset===id) return `<span class="confirm">처음부터 다시 할까요? 기록이 지워져요. <button class="btn" data-reset-yes="${id}">다시 하기</button><button class="btn ghost" data-reset-no>취소</button></span>`;
  return `<button class="fbtn" data-reset="${id}">처음부터</button>`;
}

function briefView(id){
  const c=CASES[id], cs=S.cases[id];
  const sections = c.brief.map(([h,ps])=>`<h3>${h}</h3>${ps.map(p=>`<p>${T(p)}</p>`).join("")}`).join("");
  const cast = c.cast.map((p,i)=>`<button class="person" data-person="${i}"><span class="nm">${p.nm}</span><span class="rl">${p.rl}</span><span class="more">눌러서 인물 카드 보기</span></button>`).join("");
  return `<div class="brief">
    <article class="sheet clip memo">
      <div class="hd"><span>사건 개요서</span><span>${c.no}</span></div>
      ${sections}
      <h3>${id==="map"?"용의자":"등장인물"}</h3>
      <div class="cast">${cast}</div>
      <button class="cta" data-begin="${id}">${cs.reached>0?"수사 계속하기":"수사 시작"} →</button>
    </article>
    <div class="stack">${c.side.map(evView).join("")}</div>
  </div>`;
}

function castStrip(id){
  const c=CASES[id];
  return `<div class="caststrip"><span>${id==="map"?"용의자 카드":"인물 카드"}</span>${c.cast.map((p,i)=>`<button class="namechip" data-person="${i}">${p.nm}</button>`).join("")}</div>`;
}

function evView(e){
  const head = `<div class="evh"><span class="t">${e.title}</span><span class="who">${e.who}</span></div>`;
  let b="";
  if(e.type==="log") b=`<ul class="loglist">${e.rows.map(r=>`<li><span class="tm">${r[0]}</span><span>${T(r[1])}</span></li>`).join("")}</ul>`;
  else if(e.type==="radio") b=e.lines.map(l=>`<div><div class="ts">[${l[0]}]</div><div>${T(l[1])}</div></div>`).join("");
  else if(e.type==="note"||e.type==="doc") b=e.lines.map(l=>`<p${/^<b>[^<]+<\/b>:/.test(l)?' class="def"':""}>${T(l)}</p>`).join("");
  else if(e.type==="photo") b=`<div class="photos">${e.pics.map(p=>`<figure class="photo">${p.a&&ART[p.a]?`<div class="art">${ART[p.a]}</div>`:`<div class="pic">${p.c}</div>`}<figcaption><span class="cap">${T(p.c)}</span><span class="tm">${p.t}</span></figcaption></figure>`).join("")}</div>${e.note?`<p class="small">${T(e.note)}</p>`:""}`;
  else if(e.type==="diagram") b=`<div class="diagram">${e.svg}</div>`;
  const clip = (e.type==="log"||e.type==="doc"||e.type==="diagram") ? " clip" : "";
  return `<article class="sheet ev ${e.type}${e.wide?" wide":""}${clip}">${head}<div class="evb">${b}</div></article>`;
}

function qView(id,q,num){
  const cs=S.cases[id], done=!!cs.solved[q.id];
  const n = cs.hintN[q.id]||0;
  let body="";
  if(q.type==="match"){
    const cur = sel[q.id] || {};
    body = `<div class="match">${q.rows.map((r,ri)=>{
      const v = done ? r[1] : (cur[ri]!==undefined?cur[ri]:"");
      const shown = v===""||v===undefined ? "고르기" : q.choices[+v];
      return `<div class="mrow${done?" right":""}"><span class="ml">${T(r[0])}</span>
        <label class="pick${v===""?" empty":""}"><span class="pv">${shown}</span>
        <select data-match="${q.id}" data-r="${ri}" aria-label="${esc(plain(r[0]))}" ${done?"disabled":""}>
          <option value="">고르기</option>${q.choices.map((ch,ci)=>`<option value="${ci}" ${String(v)===String(ci)?"selected":""}>${ch}</option>`).join("")}
        </select></label></div>`;}).join("")}</div>`;
  } else {
    const picked = sel[q.id] || [];
    body = `<div class="opts">${q.opts.map((o,i)=>{
      const isR = done && q.ans.includes(i);
      return `<button class="opt${q.type==="multi"?" multi":""}${isR?" right":""}" data-q="${q.id}" data-i="${i}" ${done?"disabled":""} aria-pressed="${!done&&picked.includes(i)}"><span class="bx"></span><span class="ox">${T(o)}</span></button>`;}).join("")}</div>`;
  }
  const hints = (q.hints||[]).slice(0,n).map((h,i)=>`<p class="hintline"><b>힌트 ${i+1}</b> · ${T(h)}</p>`).join("");
  let fb="";
  if(done) fb=`<div class="fb yes"><span class="tag">확인 완료</span>${T(q.exp)}</div>`;
  else if(msg[q.id]) fb=`<div class="fb no"><span class="tag">일치하지 않음</span>${T(msg[q.id])}</div>`;
  const left = (q.hints||[]).length - n;
  const btns = done ? "" : `<div class="qbtns"><button class="btn" data-check="${q.id}">제출</button>${left>0?`<button class="btn ghost" data-hint="${q.id}">힌트 보기 (+${PEN}초 · ${left}번 남음)</button>`:""}</div>`;
  return `<div class="q"><span class="qt"><span class="qn">${num}</span>${T(q.q)}</span>${body}${btns}${hints}${fb}</div>`;
}

function stageView(id,si){
  const c=CASES[id], st=c.stages[si], cs=S.cases[id];
  const allDone = st.qs.every(q=>cs.solved[q.id]);
  const last = si===c.stages.length-1;
  return `<div class="stage">
    <section style="min-width:0">
      <div class="stagehead"><span class="kick">${st.name} · 증거 서류</span><h2>${st.title}</h2><p class="goal">${T(st.goal)}</p>${castStrip(id)}</div>
      <div class="evidence">${st.ev.map(evView).join("")}</div>
    </section>
    <aside class="board" aria-label="수사 보고서">
      <div class="report">
        <div class="rh"><h3>수사 보고서</h3><span>${st.name} · 작성: ${S.team?esc(S.team):"분석관"}</span></div>
        <p class="gate" data-gate hidden></p>
        ${st.qs.map((q,i)=>qView(id,q,`${si+1}-${i+1}`)).join("")}
        ${allDone?`<button class="next" data-next="${id}">${last?"사건의 진실 확인하기":"다음 증거 서류 열기"} →</button>`:""}
      </div>
    </aside>
  </div>`;
}

function endView(id){
  const c=CASES[id], cs=S.cases[id], q=c.finalQ, done=!!cs.solved[q.id];
  const result = done ? `<div class="board"><div class="report result">
      <div class="rh"><h3>사건 해결 보고서</h3><span>${c.no}</span></div>
      <p><b>${S.team?esc(S.team):"분석관"}</b> · ${c.short}</p>
      <div class="stats"><div><b>${fmt(elapsed(cs))}</b><span>기록 시간</span></div><div><b>${cs.wrong}</b><span>오답</span></div><div><b>${cs.hints}</b><span>힌트</span></div></div>
      <p class="small">${T(`기록 시간에는 힌트 벌점(1번에 ${PEN}초)이 포함되어 있어요.`)}</p>
      <button class="btn ghost" data-home>다른 사건 파일 열기</button>
    </div></div>` : "";
  return `<div class="ending">
    <article class="sheet clip memo">
      <div class="hd"><span>사건 종결서</span><span>${c.no}</span></div>
      <span class="stamp">사건 해결</span>
      <h3>사건의 진실</h3>
      ${c.ending.map(p=>`<p>${T(p)}</p>`).join("")}
    </article>
    <div class="stack">
      <aside class="board" aria-label="마지막 임무"><div class="report">
        <div class="rh"><h3>마지막 임무</h3><span>${c.no}</span></div>
        <p>${T(c.finalTask)}</p>
        <p class="gate" data-gate hidden></p>
        ${qView(id,q,"최종")}
      </div></aside>
      ${result}
    </div>
  </div>`;
}

/* 분석 시간과 재조사 시간에 따라 제출 버튼을 잠근다 */
function updateGates(){
  const id=current(); if(!id) return;
  const c=CASES[id], cs=S.cases[id];
  const clock=document.getElementById("clock"); if(clock) clock.textContent=fmt(elapsed(cs));
  const min = cs.view>c.stages.length ? FINAL_MIN : (c.stages[cs.view-1]||{}).min||0;
  const st = cs.stageStart[cs.view]||Date.now();
  const dwell = Math.ceil((st+min*1000-Date.now())/1000);
  const g=document.querySelector("[data-gate]");
  if(g){ const show=dwell>0; if(g.hidden===show) g.hidden=!show; const t=`자료 분석 시간 · ${dwell}초\u00a0뒤에 제출할\u00a0수 있어요.`; if(show&&g.textContent!==t) g.textContent=t; }
  document.querySelectorAll("[data-check]").forEach(b=>{
    const qid=b.dataset.check, q=findQ(id,qid);
    const lock=Math.ceil(((cs.lockUntil[qid]||0)-Date.now())/1000);
    let ready=true;
    if(q.type==="match"){ const cur=sel[qid]||{}; ready=q.rows.every((r,ri)=>cur[ri]!==undefined&&cur[ri]!==""); }
    else ready=(sel[qid]||[]).length>0;
    let dis=false, txt="제출";
    if(dwell>0){dis=true;txt=`분석 중 · ${dwell}초`;}
    else if(lock>0){dis=true;txt=`재조사 중 · ${lock}초`;}
    else if(!ready){dis=true;txt=q.type==="match"?"빈칸을 모두 채우세요":"답을 고르세요";}
    if(b.disabled!==dis) b.disabled=dis;
    if(b.textContent!==txt) b.textContent=txt;
  });
}
setInterval(updateGates,500);

/* 인물 카드 */
let lastFocus=null;
function openPerson(id,i){
  const c=CASES[id], p=c.cast[i];
  lastFocus=document.activeElement;
  modal.innerHTML=`<div class="idcard" role="dialog" aria-modal="true" aria-labelledby="pname">
    <div class="bar"><span>${id==="map"?"용의자 카드":"인물 카드"}</span><span>${c.no}</span></div>
    <div class="in"><div><h3 id="pname">${p.nm}</h3><div class="rl">${p.rl}</div><p class="bio">${T(p.bio)}</p></div></div>
    <button class="btn ghost x" data-close>닫기</button>
  </div>`;
  modal.hidden=false;
  modal.querySelector("[data-close]").focus();
}
function closePerson(){ if(modal.hidden) return; modal.hidden=true; modal.innerHTML=""; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
modal.addEventListener("click",e=>{ if(e.target===modal||e.target.closest("[data-close]")) closePerson(); });
addEventListener("keydown",e=>{ if(e.key==="Escape") closePerson(); });

/* =====================================================================
   동작
   ===================================================================== */
function check(id,qid){
  const cs=S.cases[id], q=findQ(id,qid);
  let ok=false, hit=0, total=0;
  if(q.type==="match"){
    const cur=sel[qid]||{}; total=q.rows.length;
    hit=q.rows.filter((r,ri)=>String(cur[ri])===String(r[1])).length; ok=hit===total;
  } else {
    const pick=(sel[qid]||[]).slice().sort().join(), ans=q.ans.slice().sort().join(); ok=pick===ans;
  }
  if(ok){
    cs.solved[qid]=true; delete msg[qid];
    if(q===CASES[id].finalQ) cs.end=Date.now();
  } else {
    cs.wrong++; cs.fails[qid]=(cs.fails[qid]||0)+1; cs.lockUntil[qid]=Date.now()+LOCK*1000;
    const n=cs.fails[qid];
    msg[qid] = q.type==="match" && n>=3
      ? `${total}개 중 ${hit}개가 맞아요. 증거 서류를 다시 확인하고 ${LOCK}초 뒤에 다시 제출해 보세요.`
      : `증거 서류를 다시 확인하고 ${LOCK}초 뒤에 다시 제출해 보세요.${q.type==="match"?" 3번째 오답부터는 맞은 개수를 알려 줘요.":""}`;
    if(q.type!=="match") sel[qid]=[];
  }
  save(); render();
}

app.addEventListener("input",e=>{ if(e.target.id==="team"){ S.team=e.target.value.trim(); save(); } });
app.addEventListener("change",e=>{
  const s=e.target.closest("select[data-match]"); if(!s) return;
  const qid=s.dataset.match; sel[qid]=sel[qid]||{}; sel[qid][s.dataset.r]=s.value;
  const pk=s.closest(".pick"); if(pk){ pk.querySelector(".pv").textContent = s.value==="" ? "고르기" : s.options[s.selectedIndex].text; pk.classList.toggle("empty",s.value===""); }
  updateGates();
});
app.addEventListener("submit",e=>{
  if(e.target.id!=="keyform") return;
  e.preventDefault();
  const data=unlockKey(document.getElementById("keycode").value.trim());
  keyState={open:true,err:!data,data}; render();
  if(!data){ const k=document.getElementById("keycode"); if(k) k.focus(); }
});
app.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  const id=current(), d=t.dataset;
  if(d.keyOpen!==undefined){ keyState={open:true,err:false,data:null}; render(); const k=document.getElementById("keycode"); if(k) k.focus(); return; }
  if(d.keyClose!==undefined){ keyState={open:false,err:false,data:null}; render(); return; }
  if(d.go!==undefined){ location.hash=d.go; return; }
  if(d.home!==undefined){ history.pushState(null,"",location.pathname+location.search); confirmReset=null; render(); scrollTo(0,0); return; }
  if(d.person!==undefined && id){ openPerson(id,+d.person); return; }
  if(d.reset){ confirmReset=d.reset; render(); return; }
  if(d.resetNo!==undefined){ confirmReset=null; render(); return; }
  if(d.resetYes){ S.cases[d.resetYes]=blankCase(); confirmReset=null; sel={}; msg={}; save(); render(); return; }
  const cs=id&&S.cases[id]; if(!cs) return;
  if(d.step!==undefined){ cs.view=+d.step; save(); render(); scrollTo(0,0); return; }
  if(d.begin){ if(!cs.start) cs.start=Date.now(); if(cs.reached<1) cs.reached=1; cs.view=Math.max(1,cs.view||1); save(); render(); scrollTo(0,0); return; }
  if(d.q){
    const q=findQ(id,d.q), i=+d.i; let cur=sel[d.q]||[];
    cur = q.type==="multi" ? (cur.includes(i)?cur.filter(x=>x!==i):[...cur,i]) : [i];
    sel[d.q]=cur;
    t.closest(".opts").querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed",cur.includes(+o.dataset.i)));
    updateGates(); return;
  }
  if(d.hint){ cs.hintN[d.hint]=(cs.hintN[d.hint]||0)+1; cs.hints++; save(); render(); return; }
  if(d.check){ check(id,d.check); return; }
  if(d.next){ cs.reached=Math.max(cs.reached,cs.view+1); cs.view=cs.view+1; save(); render(); scrollTo(0,0); return; }
});

addEventListener("hashchange",()=>{ confirmReset=null; closePerson(); render(); scrollTo(0,0); });
render();
</script>
